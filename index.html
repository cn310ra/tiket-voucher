<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Sky Telomoyo - Pelanggan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script crossorigin src="https://unpkg.com/lucide-react/dist/umd/lucide-react.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        const { Home, Utensils, Ticket, User, Bell, Search, Plus, QrCode, X, Tag, Clock, Monitor, Smartphone, Briefcase } = LucideReact;

        function App() {
            const [currentTab, setCurrentTab] = useState('home');
            const [cart, setCart] = useState([]);
            const [tickets, setTickets] = useState([
                { id: 1, title: 'Tiket Masuk', date: '13 Okt 2026', price: 50000, qty: 2, status: 'Aktif', code: 'TRV-8892-SKY' }
            ]);
            const [vouchers] = useState([
                { id: 1, title: 'Hemat Rp 10.000', desc: 'Min. pembelian 2 Tiket Masuk' },
                { id: 2, title: 'Diskon 15%', desc: 'Makanan & Minuman • Min. Rp 50.000' }
            ]);
            const [showTicketModal, setShowTicketModal] = useState(false);
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            const menuItems = [
                { id: 1, name: 'Kopi Susu', price: 20000, desc: 'Perpaduan kopi dan manisnya susu hangat yang pas dinikmati saat menanti matahari terbit.', image: 'Gemini_Generated_Image_vgzaf6vgzaf6vgza.jpg' },
                { id: 2, name: 'Brown Sugar Ice Coffee', price: 30000, desc: 'Kopi susu dingin dengan manis khas gula aren.', image: 'Gemini_Generated_Image_6xzc0n6xzc0n6xzc.jpg' },
                { id: 3, name: 'Avocado Ice Coffee', price: 35000, desc: 'Kombinasi rasa kopi dan alpukat yang manis legit.', image: 'Gemini_Generated_Image_d46w7wd46w7wd46w.jpg' },
                { id: 4, name: 'Salted Caramel Ice Coffee', price: 30000, desc: 'Kopi susu es dengan sensasi rasa manis-gurih karamel.', image: 'Gemini_Generated_Image_1vx6tk1vx6tk1vx6.jpg' },
                { id: 5, name: 'Choco Lava Ice Coffee', price: 35000, desc: 'Paduan es kopi dan cokelat pekat kaya rasa.', image: 'Gemini_Generated_Image_7n7cu7n7cu7n7cu7.jpg' },
                { id: 6, name: 'Vanilla Ice Coffee', price: 30000, desc: 'Es kopi susu dengan aroma serta kasih vanilla alami.', image: 'Gemini_Generated_Image_jfctzhjfctzhjfct.jpg' }
            ];

            const addToCart = (item) => {
                setCart(prev => {
                    const exist = prev.find(i => i.id === item.id);
                    if (exist) return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
                    return [...prev, { ...item, qty: 1 }];
                });
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);

            return (
                <div className="min-h-screen bg-slate-900 text-slate-800 flex flex-col items-center">
                    {/* Review Mode Switcher Bar */}
                    <div className="w-full bg-slate-950 border-b border-slate-800 py-2 px-4 flex justify-center items-center space-x-4 text-xs z-50">
                        <span className="text-slate-400 font-bold">MODE REVIEW:</span>
                        <a href="index.html" className="bg-blue-600 text-white px-3 py-1 rounded-lg font-semibold flex items-center space-x-1.5"><Smartphone size={14}/><span>Pelanggan (Mobile)</span></a>
                        <a href="kasir.html" className="bg-slate-800 text-slate-300 hover:text-white px-3 py-1 rounded-lg font-semibold flex items-center space-x-1.5 transition"><Monitor size={14}/><span>Kasir (POS)</span></a>
                        <a href="manajer.html" className="bg-slate-800 text-slate-300 hover:text-white px-3 py-1 rounded-lg font-semibold flex items-center space-x-1.5 transition"><Briefcase size={14}/><span>Manajer (Dasbor)</span></a>
                    </div>

                    <div className="w-full max-w-4xl bg-slate-50 min-h-screen flex flex-col shadow-2xl relative pb-24 md:pb-8">
                        <header className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between shadow-md">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-lg">TS</div>
                                <div>
                                    <h1 className="font-bold text-sm tracking-wider uppercase text-blue-400">Triangle Sky</h1>
                                    <p className="text-xs text-slate-300">Telomoyo, Salatiga</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3">
                                <button className="p-2 rounded-full bg-slate-800 text-slate-300 relative"><Bell size={18} /><span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
                                <button onClick={() => setCurrentTab('profile')} className="p-2 rounded-full bg-slate-800 text-slate-300"><User size={18} /></button>
                            </div>
                        </header>

                        <main className="flex-1 p-4 md:p-6 overflow-y-auto">
                            {currentTab === 'home' && (
                                <div className="space-y-6">
                                    <div className="relative rounded-2xl overflow-hidden shadow-lg h-52 md:h-64 flex items-end p-6">
                                        <img src="IMG_4926.jpg" alt="Telomoyo" className="absolute inset-0 w-full h-full object-cover" style={{objectPosition:"center 68%"}} />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
                                        <div className="relative z-10 text-white space-y-1">
                                            <span className="bg-blue-600 text-[10px] font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">Wisata Alam</span>
                                            <h2 className="text-xl md:text-2xl font-bold">Triangle Sky Telomoyo</h2>
                                            <p className="text-xs text-slate-200">More than just a view, it's an experience.</p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-4 gap-3">
                                        <button onClick={() => setCurrentTab('ticket')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center border border-slate-100">
                                            <Ticket size={20} className="text-blue-600 mb-1" /><span className="text-xs font-medium">Tiket Masuk</span>
                                        </button>
                                        <button onClick={() => setCurrentTab('menu')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center border border-slate-100">
                                            <Utensils size={20} className="text-orange-600 mb-1" /><span className="text-xs font-medium">Menu</span>
                                        </button>
                                        <button onClick={() => setCurrentTab('voucher')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center border border-slate-100">
                                            <Tag size={20} className="text-purple-600 mb-1" /><span className="text-xs font-medium">Voucher</span>
                                        </button>
                                        <div className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center border border-slate-100">
                                            <Clock size={20} className="text-emerald-600 mb-1" /><span className="text-xs font-medium">Antrean</span>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <h3 className="font-bold text-sm text-slate-800">Tiket & Voucher Saya</h3>
                                        {tickets.map(t => (
                                            <div key={t.id} onClick={() => { setSelectedTicket(t); setShowTicketModal(true); }} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center cursor-pointer">
                                                <div>
                                                    <span className="font-bold text-sm">{t.qty} × {t.title}</span>
                                                    <p className="text-xs text-slate-500">{t.date} • Rp {t.price.toLocaleString()}</p>
                                                </div>
                                                <QrCode size={22} className="text-slate-400" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {currentTab === 'menu' && (
                                <div className="space-y-4">
                                    <h2 className="font-bold text-base text-slate-800">Menu Makanan & Minuman</h2>
                                    <div className="flex items-center space-x-2 bg-white px-3 py-2 rounded-xl border border-slate-200">
                                        <Search size={16} className="text-slate-400" />
                                        <input type="text" placeholder="Cari menu kopi..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full text-xs outline-none bg-transparent" />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {menuItems.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase())).map(item => (
                                            <div key={item.id} className="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex space-x-3 items-center">
                                                <img src={item.image} alt={item.name} className="w-20 h-20 rounded-lg object-cover bg-slate-100" />
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-xs text-slate-800">{item.name}</h4>
                                                    <p className="text-[11px] text-slate-500 line-clamp-2">{item.desc}</p>
                                                    <div className="flex justify-between items-center mt-2">
                                                        <span className="font-bold text-xs text-blue-600">Rp {item.price.toLocaleString()}</span>
                                                        <button onClick={() => addToCart(item)} className="w-7 h-7 bg-blue-600 text-white rounded-lg flex items-center justify-center"><Plus size={14} /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {currentTab === 'ticket' && (
                                <div className="space-y-4">
                                    <h2 className="font-bold text-base text-slate-800">Tiket Kunjungan</h2>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                                        <img src="IMG_4926.jpg" alt="Tiket" className="w-full h-40 object-cover rounded-xl" style={{objectPosition:"center 68%"}} />
                                        <h3 className="font-bold text-sm">Tiket Masuk Triangle Sky</h3>
                                        <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                            <span className="font-bold text-blue-600">Rp 50.000</span>
                                            <button onClick={() => { addToCart({ id: 99, name: 'Tiket Masuk', price: 50000, image: 'IMG_4926.jpg' }); setCurrentTab('home'); }} className="bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-xl">Beli Tiket</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentTab === 'voucher' && (
                                <div className="space-y-4">
                                    <h2 className="font-bold text-base text-slate-800">Voucher Untukmu</h2>
                                    {vouchers.map(v => (
                                        <div key={v.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                                            <div><h4 className="font-bold text-xs">{v.title}</h4><p className="text-[11px] text-slate-500">{v.desc}</p></div>
                                            <span className="text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg">Klaim</span>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {currentTab === 'profile' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center space-y-2">
                                    <div className="w-20 h-20 bg-blue-100 text-blue-600 font-bold text-2xl rounded-full flex items-center justify-center mx-auto">CA</div>
                                    <h3 className="font-bold text-base">Candra Aditya Bayu Aji</h3>
                                    <p className="text-xs text-slate-400">ID: 24500006</p>
                                </div>
                            )}
                        </main>

                        {cart.length > 0 && (
                            <div className="fixed bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xl bg-slate-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center z-40">
                                <div><p className="text-xs text-slate-300">Total Keranjang ({cartCount})</p><p className="font-bold text-sm">Rp {cartTotal.toLocaleString()}</p></div>
                                <button onClick={() => alert('Pesanan berhasil dibuat!')} className="bg-white text-slate-900 text-xs font-bold px-4 py-2.5 rounded-xl">Checkout</button>
                            </div>
                        )}

                        <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-6 flex justify-around items-center z-30">
                            <button onClick={() => setCurrentTab('home')} className={`flex flex-col items-center ${currentTab === 'home' ? 'text-blue-600' : 'text-slate-400'}`}><Home size={20} /><span className="text-[10px]">Home</span></button>
                            <button onClick={() => setCurrentTab('menu')} className={`flex flex-col items-center ${currentTab === 'menu' ? 'text-blue-600' : 'text-slate-400'}`}><Utensils size={20} /><span className="text-[10px]">Menu</span></button>
                            <button onClick={() => setCurrentTab('ticket')} className={`flex flex-col items-center ${currentTab === 'ticket' ? 'text-blue-600' : 'text-slate-400'}`}><Ticket size={20} /><span className="text-[10px]">Tiket</span></button>
                            <button onClick={() => setCurrentTab('profile')} className={`flex flex-col items-center ${currentTab === 'profile' ? 'text-blue-600' : 'text-slate-400'}`}><User size={20} /><span className="text-[10px]">Profile</span></button>
                        </nav>

                        {showTicketModal && selectedTicket && (
                            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                                <div className="bg-white w-full max-w-sm rounded-2xl p-6 text-center space-y-4 relative shadow-2xl">
                                    <button onClick={() => setShowTicketModal(false)} className="absolute top-4 right-4 text-slate-400"><X size={20} /></button>
                                    <h3 className="font-bold text-base">QR Code Tiket Saya</h3>
                                    <div className="bg-slate-50 p-6 rounded-xl flex flex-col items-center space-y-3">
                                        <div className="w-40 h-40 bg-slate-900 rounded-xl flex items-center justify-center text-white"><QrCode size={100} /></div>
                                        <p className="text-xs font-mono font-bold">{selectedTicket.code}</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
